<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Haneef | AI Safety Researcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --text: #333;
            --card-bg: #fff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            margin: 0;
            background-color: var(--bg);
        }

        /* Header / Hero */
        header {
            background-color: #fff;
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        h1 { margin: 0; font-size: 2.5rem; color: var(--primary); }
        .subtitle { color: #666; font-size: 1.2rem; margin-top: 0.5rem; }
        .social-links { margin-top: 1.5rem; }
        .social-links a {
            color: var(--primary);
            font-size: 1.5rem;
            margin: 0 10px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .social-links a:hover { color: var(--accent); }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        section { margin-bottom: 3rem; }
        h2 { 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: 0.5rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        /* Cards for Projects/Research */
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .card h3 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
        .date { color: #888; font-size: 0.9rem; font-style: italic; }
        .tags span {
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #555;
            margin-right: 5px;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            text-align: center;
        }
        .skill-item {
            background: #fff;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            header { padding: 2rem 1rem; }
            h1 { font-size: 2rem; }
        }
